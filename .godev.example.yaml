# Copy to .godev.yaml at your project root to override discovery
# defaults. Every field is optional; godev works with zero config.
services:
  api:
    path: ./cmd/api
    args:
      - --port
      - "8080"
    env:
      LOG_LEVEL: debug
    auto_start: true
    auto_restart: true
    hot_reload: true
  worker:
    path: ./cmd/worker
    args:
      - --concurrency
      - "10"
    auto_start: true
    hot_reload: true
  scheduler:
    path: ./cmd/scheduler
    auto_start: false
